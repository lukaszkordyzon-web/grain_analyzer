[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grain_analyzer"
version = "0.1.0"
description = "Grain size analysis from photos: SAM + Depth Anything V2 + ArUco scale marker"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
